name: Django Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Проверяем существование requirements.txt перед установкой
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt not found, installing basic packages"
            pip install Django celery redis pytest pytest-django django-celery-results
          fi

      - name: Setup Django environment
        env:
          # Указываем Django settings модуль
          DJANGO_SETTINGS_MODULE: config.settings
          # Настраиваем переменные для Redis
          CELERY_BROKER_URL: redis://localhost:6379/0
        run: |
          echo "DJANGO_SETTINGS_MODULE is set to $DJANGO_SETTINGS_MODULE"
          echo "CELERY_BROKER_URL is set to $CELERY_BROKER_URL"

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py migrate

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          # Запускаем тесты с подробным выводом
          pytest -v --tb=short