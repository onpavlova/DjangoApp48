name: Django Tests  # Название workflow в интерфейсе GitHub

on: [push, pull_request]  # Запускать тесты при пуше или создании PR[citation:1]

jobs:
  test:
    runs-on: ubuntu-latest  # ОС для виртуальной машины[citation:1][citation:2]
    strategy:
      matrix:
        python-version: ['3.13'] # Укажите вашу версию Python

    steps:
      # 1. Получить код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установить Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # Опционально: кешировать зависимости для ускорения

      # 3. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Установите зависимости из вашего файла
          pip install -r requirements.txt
          # Убедитесь, что установлены pytest и pytest-django
          pip install pytest pytest-django[citation:2]

      # 4. Выполнить миграции БД (для SQLite это создаст файл)
      - name: Run migrations
        run: python manage.py migrate

      # 5. Запустить тесты с помощью pytest[citation:1]
      - name: Run tests with pytest
        run: pytest -v  # Флаг -v для подробного вывода